<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NutriPlan - Daily Intake Log</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <h2>NutriPlan</h2>
    <div class="nav-links">
      <a href="index.html">Food Search & Calculator</a>
      <a href="tracker.html" class="active">Daily Intake Log (CRUD)</a>
    </div>
  </nav>

  <div class="container">
    <!-- Log Form Card -->
    <div class="card">
      <h3>📝 Log New Food Intake</h3>
      <p class="subtitle">Add your meals to track your daily calorie intake</p>

      <div class="search-box">
        <input type="text" id="logFoodName" placeholder="Meal / Food Name (e.g. Oatmeal)" style="flex: 2;">
        <input type="number" id="logCalories" placeholder="Calories (kcal)" style="flex: 1;">
        <select id="logCategory" style="flex: 1;">
          <option value="Breakfast">Breakfast</option>
          <option value="Lunch">Lunch</option>
          <option value="Dinner">Dinner</option>
          <option value="Snack">Snack</option>
        </select>
        <button id="addLogBtn">Add to Log</button>
      </div>
      <div id="crudStatus" class="message hidden"></div>
    </div>

    <!-- Intake Table Card -->
    <div class="card">
      <h3>🥗 Daily Intake Log Records</h3>
      <p class="subtitle">Saved intake records stored in Local Storage</p>

      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Meal Name</th>
            <th>Category</th>
            <th>Calories</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="crudTableBody">
          <!-- Dynamically populated -->
        </tbody>
      </table>
    </div>
  </div>

  <script src="renderer-crud.js"></script>
</body>
</html>
